        // ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ ДЛЯ JS-СТИЛЕЙ (Заменяет CSS)
        function setStyle(element, styles) {
            for (let property in styles) {
                element.style[property] = styles[property];
            }
            return element;
        }

        // ФУНКЦИЯ АНИМАЦИИ НА ЧИСТОМ JS (requestAnimationFrame)
        function animateEntrance(element) {
            let startTime = null;
            const duration = 600;
            const startY = 30;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const currentY = startY * (1 - ease);
                const currentOpacity = ease;

                element.style.transform = `translateY(${currentY}px)`;
                element.style.opacity = currentOpacity;

                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            }
            window.requestAnimationFrame(step);
        }

        // ФУНКЦИЯ ОТРИСОВКИ РАБОЧЕГО КАЛЕНДАРЯ
        function renderCalendarGrid(containerElement) {
            containerElement.innerHTML = '';
            
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            
            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            
            // Обновляем заголовок месяца
            const monthYearEl = document.getElementById('calendar-month-year');
            if (monthYearEl) {
                monthYearEl.innerText = monthNames[month] + ' ' + year;
            }

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let firstDay = new Date(year, month, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1; // Делаем понедельник первым днем (0)

            const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            daysOfWeek.forEach(day => {
                const d = document.createElement('div');
                d.innerText = day;
                setStyle(d, { textAlign: 'center', fontWeight: 'bold', color: '#a0aec0', padding: '12px 0', fontSize: '14px' });
                containerElement.appendChild(d);
            });

            // Пустые ячейки до первого дня месяца
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                containerElement.appendChild(emptyCell);
            }

            // Дни месяца
            for (let i = 1; i <= daysInMonth; i++) {
                const dayCell = document.createElement('div');
                dayCell.innerText = i;
                
                const dayOfWeek = new Date(year, month, i).getDay();
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                
                setStyle(dayCell, {
                    padding: '15px 0', textAlign: 'center',
                    backgroundColor: isWeekend ? '#2d3748' : '#0f1419',
                    borderRadius: '4px', cursor: 'pointer', fontWeight: 'bold',
                    color: '#a0aec0', transition: 'all 0.2s', fontSize: '14px', border: '1px solid #2d3748'
                });

                dayCell.onmouseover = () => {
                    if (dayCell.style.backgroundColor !== '#0066cc') {
                        dayCell.style.backgroundColor = isWeekend ? '#4a5568' : '#2d3748';
                        dayCell.style.transform = 'scale(1.05)';
                        dayCell.style.color = '#ffffff';
                    }
                };
                dayCell.onmouseout = () => {
                    if (dayCell.style.backgroundColor !== '#0066cc') {
                        dayCell.style.backgroundColor = isWeekend ? '#2d3748' : '#0f1419';
                        dayCell.style.transform = 'scale(1)';
                        dayCell.style.color = '#a0aec0';
                    }
                };

                dayCell.onclick = () => {
                    // Сброс всех ячеек
                    const cells = containerElement.querySelectorAll('div');
                    cells.forEach(child => {
                        if (child.innerText >= '1' && child.innerText <= '31') {
                            const cellDay = parseInt(child.innerText);
                            const cellDayOfWeek = new Date(year, month, cellDay).getDay();
                            const cellIsWeekend = cellDayOfWeek === 0 || cellDayOfWeek === 6;
                            child.style.backgroundColor = cellIsWeekend ? '#2d3748' : '#0f1419';
                            child.style.color = '#a0aec0';
                        }
                    });
                    // Выделение выбранного
                    dayCell.style.backgroundColor = '#0066cc';
                    dayCell.style.color = '#ffffff';
                    
                    const formattedMonth = String(month + 1).padStart(2, '0');
                    const formattedDay = String(i).padStart(2, '0');
                    selectedDateStr = `${formattedDay}.${formattedMonth}.${year}`;
                };

                containerElement.appendChild(dayCell);
            }
        }

            const calendarGrid = document.createElement('div');
            setStyle(calendarGrid, { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '8px' });

            calendarSection.appendChild(calendarTitle);
            calendarSection.appendChild(calendarHeader);
            calendarSection.appendChild(calendarGrid);
            mainContent.appendChild(calendarSection);

            // Отрисовываем календарь после добавления в DOM
            setTimeout(() => {
                renderCalendarGrid(calendarGrid);
            }, 50);

            // ФОРМА ЗАПИСИ
            const formSection = document.createElement('div');
            setStyle(formSection, {
                backgroundColor: '#1a202c', padding: '30px', borderRadius: '8px',
                boxShadow: '0 4px 6px rgba(0, 0, 0, 0.2)', border: '1px solid #2d3748'
            });

            const formTitle = document.createElement('h2');
            formTitle.innerText = 'Ваши данные';
            setStyle(formTitle, { fontSize: '20px', color: '#ffffff', marginBottom: '25px', textAlign: 'center', fontWeight: 'bold' });

            const form = document.createElement('form');
            setStyle(form, { display: 'flex', flexDirection: 'column', gap: '18px' });

            const formGroups = [
                { id: 'inp-name', label: 'Ваше имя', type: 'text', placeholder: 'Иван Иванов' },
                { id: 'inp-phone', label: 'Телефон', type: 'tel', placeholder: '+7 (999) 123-45-67' },
                { id: 'inp-email', label: 'Email', type: 'email', placeholder: 'example@mail.ru' }
            ];

            formGroups.forEach(group => {
                const label = document.createElement('label');
                label.innerText = group.label;
                label.htmlFor = group.id;
                setStyle(label, { fontSize: '14px', color: '#cbd5e0', fontWeight: '600', marginBottom: '5px', display: 'block' });

                const input = document.createElement('input');
                input.type = group.type;
                input.id = group.id;
                input.placeholder = group.placeholder;
                setStyle(input, {
                    padding: '12px', fontSize: '14px', border: '1px solid #2d3748', borderRadius: '4px',
                    outline: 'none', width: '100%', boxSizing: 'border-box', backgroundColor: '#0f1419', color: '#ffffff'
                });

                input.onfocus = () => { input.style.borderColor = '#0066cc'; };
                input.onblur = () => { input.style.borderColor = '#2d3748'; };

                form.appendChild(label);
                form.appendChild(input);
            });

            const categoryLabel = document.createElement('label');
            categoryLabel.innerText = 'Категория';
            setStyle(categoryLabel, { fontSize: '14px', color: '#cbd5e0', fontWeight: '600', marginBottom: '5px', display: 'block' });

            const categorySelect = document.createElement('select');
            setStyle(categorySelect, {
                padding: '12px', fontSize: '14px', border: '1px solid #2d3748', borderRadius: '4px',
                backgroundColor: '#0f1419', color: '#ffffff', width: '100%', boxSizing: 'border-box'
            });

            ['A - Мотоциклы', 'B - Легковые авто', 'C - Грузовые авто', 'D - Автобусы', 'BE - Легковые с прицепом', 'CE - Грузовые с прицепом'].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat; opt.style.backgroundColor = '#1a202c';
                categorySelect.appendChild(opt);
            });

            form.appendChild(categoryLabel);
            form.appendChild(categorySelect);

            const timeLabel = document.createElement('label');
            timeLabel.innerText = 'Время занятия';
            setStyle(timeLabel, { fontSize: '14px', color: '#cbd5e0', fontWeight: '600', marginBottom: '5px', display: 'block' });

            const timeSelect = document.createElement('select');
            setStyle(timeSelect, {
                padding: '12px', fontSize: '14px', border: '1px solid #2d3748', borderRadius: '4px',
                backgroundColor: '#0f1419', color: '#ffffff', width: '100%', boxSizing: 'border-box'
            });

            ['09:00 - 10:30', '11:00 - 12:30', '13:00 - 14:30', '15:00 - 16:30', '17:00 - 18:30', '19:00 - 20:30'].forEach(time => {
                const opt = document.createElement('option');
                opt.value = time; opt.innerText = time; opt.style.backgroundColor = '#1a202c';
                timeSelect.appendChild(opt);
            });

            form.appendChild(timeLabel);
            form.appendChild(timeSelect);

            const submitBtn = document.createElement('button');
            submitBtn.type = 'button';
            submitBtn.innerText = 'Подтвердить запись';
            setStyle(submitBtn, {
                padding: '14px', fontSize: '16px', fontWeight: '600', color: '#ffffff',
                backgroundColor: '#0066cc', border: 'none', borderRadius: '6px', cursor: 'pointer',
                boxShadow: '0 2px 4px rgba(0, 0, 0, 0.2)', marginTop: '10px'
            });

            submitBtn.onmouseover = () => { submitBtn.style.backgroundColor = '#0052a3'; submitBtn.style.transform = 'translateY(-2px)'; };
            submitBtn.onmouseout = () => { submitBtn.style.backgroundColor = '#0066cc'; submitBtn.style.transform = 'translateY(0)'; };

            submitBtn.onclick = () => {
                const name = document.getElementById('inp-name').value;
                const phone = document.getElementById('inp-phone').value;
                
                if (!name || !phone || !selectedDateStr) {
                    alert('Ошибка: Пожалуйста, заполните все обязательные поля и выберите дату в календаре.');
                    return;
                }
                
                const instructorText = selectedInstructor ? '\nИнструктор: ' + selectedInstructor : '';
                
                alert('ЗАПИСЬ УСПЕШНО СОЗДАНА!\n\nДата: ' + selectedDateStr + '\nВремя: ' + timeSelect.value + '\nКатегория: ' + categorySelect.value + '\nИмя: ' + name + '\nТелефон: ' + phone + instructorText + '\n\nНаш менеджер свяжется с вами для подтверждения.');
            };

            form.appendChild(submitBtn);
            formSection.appendChild(formTitle);
            formSection.appendChild(form);
            mainContent.appendChild(formSection);

            container.appendChild(mainContent);

            const infoSection = document.createElement('div');
            setStyle(infoSection, {
                marginTop: '40px', padding: '30px', backgroundColor: '#0066cc', borderRadius: '8px',
                color: '#ffffff', textAlign: 'center', boxShadow: '0 4px 6px rgba(0, 0, 0, 0.2)'
            });

            const infoTitle = document.createElement('h3');
            infoTitle.innerText = 'Остались вопросы?';
            setStyle(infoTitle, { fontSize: '22px', marginBottom: '15px', fontWeight: 'bold', color: '#ffffff' });

            const infoPhone = document.createElement('div');
            infoPhone.innerText = '+7 (999) 123-45-67';
            setStyle(infoPhone, { fontSize: '24px', fontWeight: 'bold', color: '#ffffff', marginBottom: '10px' });

            const infoHours = document.createElement('p');
            infoHours.innerText = 'Работаем ежедневно с 9:00 до 21:00';
            setStyle(infoHours, { fontSize: '15px', color: '#cbd5e0' });

            infoSection.appendChild(infoTitle);
            infoSection.appendChild(infoPhone);
            infoSection.appendChild(infoHours);
            container.appendChild(infoSection);

            return container;
        }

        // РОУТЕР
        const app = document.getElementById('app');
        
        // Глобальные стили приложения через JS
        app.style.fontFamily = "'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif";
        app.style.color = "#e2e8f0";
        app.style.margin = "0";
        app.style.padding = "0";
        app.style.backgroundColor = "#0a0e1a";
        app.style.minHeight = "100vh";

        let currentPageIndex = 0;

        function router(pageIndex) {
            currentPageIndex = pageIndex;
            app.innerHTML = '';

            app.appendChild(renderNav());

            let pageContent;
            if (pageIndex === 0) pageContent = renderHome();
            else if (pageIndex === 1) pageContent = renderCourses();
            else if (pageIndex === 2) pageContent = renderInstructors();
            else if (pageIndex === 3) pageContent = renderSchedule();

            const animWrapper = document.createElement('div');
            setStyle(animWrapper, { opacity: '0', transform: 'translateY(40px)' });
            
            animWrapper.appendChild(pageContent);
            app.appendChild(animWrapper);

            animateEntrance(animWrapper);
        }

        router(0);
    </script>
</body>
</html>
